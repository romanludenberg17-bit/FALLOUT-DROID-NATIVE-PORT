plugins { id 'com.android.application' }

// Version: bump on every release (see PORT_PROGRESS.md).
def fdVersionName = "2.0.0-alpha43"
def fdVersionCode = 342

android {
    namespace 'com.wastelanddroid'
    compileSdk 36
    ndkVersion "29.0.14206865"
    defaultConfig {
        // Separate id while the Proton build (com.rommy.falloutdroid) still exists on devices.
        applicationId "com.rommy.falloutdroid.nativeport"
        minSdk 29
        targetSdk 35
        versionCode fdVersionCode
        versionName fdVersionName
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { useLegacyPackaging true }   // extractNativeLibs: large .so, faster first start
    }
    androidResources {
        noCompress += ['mp4', 'mp3', 'zip', 'ttf', 'jpg', 'png']
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.games:games-activity:4.4.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    // [nvport] .7z mod archives (LZMA/LZMA2): commons-compress + xz.
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    // [nvport] .rar mod archives (RAR 1.5-4.x; RAR5 is not read).
    implementation 'com.github.junrar:junrar:7.5.5'
}
