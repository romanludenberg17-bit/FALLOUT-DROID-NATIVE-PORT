"Download DLSS" = "Скачать DLSS"
"NVForever fetches eight files for DLSS upscaling and frame generation from NVIDIA's Streamline 2.14.16 release on GitHub: sl.interposer.dll, sl.common.dll, sl.dlss.dll, sl.dlss_g.dll, sl.reflex.dll and sl.pcl.dll, under Streamline's MIT licence, and nvngx_dlss.dll and nvngx_dlssg.dll, under NVIDIA's RTX SDKs licence below. Nothing is downloaded unless you accept it." = "Fallout Droid загружает восемь файлов для масштабирования DLSS и генерации кадров из выпуска NVIDIA Streamline 2.14.16 на GitHub: sl.interposer.dll, sl.common.dll, sl.dlss.dll, sl.dlss_g.dll, sl.reflex.dll и sl.pcl.dll по лицензии MIT Streamline, а также nvngx_dlss.dll и nvngx_dlssg.dll по лицензии NVIDIA RTX SDK, приведенной ниже. Без вашего согласия ничего не загружается."
"NVIDIA's RTX SDKs licence for nvngx_dlss.dll and nvngx_dlssg.dll" = "Лицензия NVIDIA RTX SDK для nvngx_dlss.dll и nvngx_dlssg.dll"
