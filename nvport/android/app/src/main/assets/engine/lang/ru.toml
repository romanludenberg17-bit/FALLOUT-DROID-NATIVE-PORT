"The dlss folder already holds {name}, which was left as it is: remove it, or copy the files by hand." = "В папке dlss уже есть {name}, он оставлен как есть: удалите его или скопируйте файлы вручную."
"The files could not be written to the dlss folder." = "Не удалось записать файлы в папку dlss."
"The download stopped on an internal error; the log says more." = "Загрузка остановилась из-за внутренней ошибки; подробности в журнале."
