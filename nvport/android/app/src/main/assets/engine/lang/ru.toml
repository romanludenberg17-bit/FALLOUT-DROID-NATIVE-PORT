"The game goes on meanwhile. Hide keeps the download running; its choice on the Upscaler row shows this again. Loading a save, going to the main menu or quitting stops it." = "Игра тем временем продолжается. «Скрыть» оставляет загрузку идти; ее пункт в строке «Масштабирование» снова покажет это окно. Загрузка сохранения, выход в главное меню или из игры прерывает ее."
